name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t finta:ci .
      - name: Smoke test
        run: |
          docker run -d --name finta -p 3000:3000 -e APP_URL=http://localhost:3000 -e ALLOW_INSECURE_HTTP=true finta:ci
          for i in $(seq 1 20); do curl -fs http://localhost:3000/healthz && break; sleep 1; done
          curl -fs http://localhost:3000/ | grep -q '<title>Finta</title>'
          docker logs finta | grep -q 'Setup code'
